# Coolify (Docker Compose build pack) — default compose file.
#
# IMPORTANT: this does NOT publish a host port. Coolify's proxy reaches the
# container over the Docker network, so binding 0.0.0.0:3000 on the host (which
# can collide with other services: "port is already allocated") is unnecessary
# and harmful here.
#
# In Coolify, for the `web` service set:
#   - Domain (FQDN)  -> sets SERVICE_FQDN_WEB and the Traefik labels
#   - SERVICE_PORT_WEB=3000   (so the proxy targets the container's port)
#   - Persistent Storage: a volume mounted at /data holding id.json,
#     registry.json and flagship.json
#
# NEXT_PUBLIC_* are build-time values (inlined into the client bundle).
services:
  web:
    build:
      context: ./stocklanda_frontend
      args:
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_PYTH_API_KEY: ${NEXT_PUBLIC_PYTH_API_KEY:-}
    image: stocklanda-frontend:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_PYTH_API_KEY: ${NEXT_PUBLIC_PYTH_API_KEY:-}
      RPC_URL: ${RPC_URL:-https://api.devnet.solana.com}
      PORT: "3000"
      KEYPAIR_PATH: /data/id.json
      REGISTRY_PATH: /data/registry.json
      FLAGSHIP_PATH: /data/flagship.json
    expose:
      - "3000"
    volumes:
      # Host directory holding id.json / registry.json / flagship.json.
      # Set STOCKLANDA_DATA_DIR in Coolify if you want a different path.
      - ${STOCKLANDA_DATA_DIR:-/srv/stocklanda}:/data
